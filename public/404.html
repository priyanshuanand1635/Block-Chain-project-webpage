<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // Redirect to index.html with hash for HashRouter
        const path = window.location.pathname.slice(1);
        if (path) {
            window.location.replace('/Block-Chain-project-webpage/#/' + path);
        } else {
            window.location.replace('/Block-Chain-project-webpage/');
        }
    </script>
</head>

<body>
    <p>Redirecting...</p>
</body>

</html>
